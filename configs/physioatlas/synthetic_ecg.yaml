schema_version: physioatlas.config.v2
name: synthetic-ecg-complex-link
hypothesis: >-
  A geometry-conditioned multi-link model can recover a generated ECG-like
  waveform from synthetic RF mixtures better than a constant predictor. This
  validates software behavior only.
claim_boundary: >-
  Synthetic pipeline verification only. No biological, anatomical, diagnostic,
  blood-pressure, organ-imaging, or clinical claim is allowed.
research_only: true
output: ../../outputs/physioatlas/synthetic_ecg
data:
  root: ../../data/physioatlas/synthetic
  target: ecg
  sample_rate_hz: 20.0
  window_seconds: 8.0
  stride_seconds: 4.0
  max_gap_s: 0.25
  require_consent: true
split:
  strategy: subject
  validation_fraction: 0.25
  held_out_groups: []
training:
  epochs: 3
  batch_size: 8
  learning_rate: 0.001
  hidden_dim: 48
  layers: 1
  seed: 42
  device: auto
  use_auxiliary: true
  use_geometry: true
  architecture: complex_link
  causal: false
  uncertainty_weight: 0.05
  observability_weight: 0.1
