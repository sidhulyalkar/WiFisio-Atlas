schema_version: physioatlas.config.v2
name: synthetic-environment-holdout
hypothesis: >-
  A model trained in synthetic-room-1 should retain predictive information in
  synthetic-room-2 without using validation-room windows during training.
claim_boundary: Synthetic environment-generalization infrastructure test only.
research_only: true
output: ../../outputs/physioatlas/synthetic_environment_holdout
data:
  root: ../../data/physioatlas/synthetic
  target: ecg
  sample_rate_hz: 20.0
  window_seconds: 8.0
  stride_seconds: 4.0
  max_gap_s: 0.25
  require_consent: true
split:
  strategy: environment
  validation_fraction: 0.5
  held_out_groups:
    - synthetic-room-2
training:
  epochs: 3
  batch_size: 8
  learning_rate: 0.001
  hidden_dim: 48
  layers: 1
  seed: 42
  device: auto
  use_auxiliary: true
  use_geometry: true
  architecture: complex_link
  causal: true
